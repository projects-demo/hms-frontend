server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing - any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache config.js - it's regenerated per-container-start and must
    # always be fetched fresh, unlike the hashed JS/CSS bundles.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}